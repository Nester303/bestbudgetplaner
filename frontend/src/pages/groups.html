<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupy — BudzetApp</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/init.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-header">
      <div class="topbar">
        <div>
          <h1 class="page-title">Grupy</h1>
          <p class="page-subtitle">Zarządzaj wspólnym budżetem</p>
        </div>
        <button class="btn btn-primary btn-sm" id="createGroupBtn">+ Utwórz grupę</button>
      </div>
    </div>

    <div class="page-body page-enter">
      <div id="groupsGrid" class="grid-3">
        <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>

      <!-- Group detail panel -->
      <div id="groupDetail" style="display:none;margin-top:16px">
        <div class="topbar" style="margin-bottom:16px">
          <div>
            <h2 style="font-size:17px;font-weight:600" id="groupDetailName"></h2>
            <p style="font-size:13px;color:var(--text-secondary)" id="groupDetailRole"></p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" id="addGroupTxBtn">+ Transakcja</button>
            <button class="btn btn-secondary btn-sm" id="addGroupInvoiceBtn">+ Faktura</button>
            <button class="btn btn-secondary btn-sm" id="addGroupEventBtn">+ Wydarzenie</button>
            <button class="btn btn-secondary btn-sm" id="inviteMemberBtn">+ Zaproś</button>
            <button class="btn btn-ghost btn-sm" id="leaveGroupBtn" style="color:var(--red)">Opuść</button>
            <button class="btn btn-ghost btn-sm" id="closeDetailBtn">✕</button>
          </div>
        </div>

        <div class="grid-3" style="margin-bottom:16px">
          <div class="metric-card">
            <div class="metric-label">Przychody grupy</div>
            <div class="metric-value positive" id="gdIncome">—</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Wydatki grupy</div>
            <div class="metric-value" id="gdExpense">—</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Saldo grupy</div>
            <div class="metric-value" id="gdBalance">—</div>
          </div>
        </div>

        <!-- Tabs -->
        <div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)">
          <button class="group-tab active" data-tab="transactions">Transakcje</button>
          <button class="group-tab" data-tab="members">Członkowie</button>
          <button class="group-tab" data-tab="calendar">Kalendarz</button>
        </div>

        <div id="tabTransactions">
          <div class="card" style="padding:0;overflow:hidden">
            <div id="groupTxList" style="padding:8px 0"></div>
          </div>
        </div>

        <div id="tabMembers" style="display:none">
          <div class="card">
            <div id="membersList"></div>
          </div>
        </div>

        <div id="tabCalendar" style="display:none">
          <div class="card">
            <div id="groupCalList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer edukacyjny -->

    <footer style="padding:14px 32px;font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:auto;text-align:center">⚠️ Projekt edukacyjny — twórcy nie ponoszą odpowiedzialności za szkody wyrządzone poprzez użytkowanie tej aplikacji.</footer>
  </main>
</div>

<!-- Create Group Modal -->
<div class="modal-overlay hidden" id="groupModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nowa grupa</span>
      <div class="modal-close" id="groupModalClose">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
      </div>
    </div>
    <form id="groupForm">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-group">
          <label class="form-label">Nazwa grupy <span class="required">*</span></label>
          <input class="form-input" id="gName" type="text" placeholder="np. Rodzina Kowalskich">
        </div>
        <div class="form-group">
          <label class="form-label">Typ</label>
          <select class="form-select" id="gType">
            <option value="family">Rodzina</option>
            <option value="company">Firma</option>
            <option value="other">Inne</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Opis</label>
          <textarea class="form-textarea" id="gDesc" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="groupCancelBtn">Anuluj</button>
        <button type="submit" class="btn btn-primary btn-sm" id="groupSaveBtn">Utwórz</button>
      </div>
    </form>
  </div>
</div>

<!-- Invite Modal -->
<div class="modal-overlay hidden" id="inviteModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Zaproś członka</span>
      <div class="modal-close" id="inviteModalClose">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
      </div>
    </div>
    <form id="inviteForm">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-group">
          <label class="form-label">Adres email <span class="required">*</span></label>
          <input class="form-input" id="invEmail" type="email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Rola</label>
          <select class="form-select" id="invRole">
            <option value="member">Członek</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="inviteCancelBtn">Anuluj</button>
        <button type="submit" class="btn btn-primary btn-sm" id="inviteSaveBtn">Zaproś</button>
      </div>
    </form>
  </div>
</div>

<!-- Add Transaction Modal -->
<div class="modal-overlay hidden" id="groupTxModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Dodaj transakcję grupy</span>
      <div class="modal-close" id="groupTxModalClose">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
      </div>
    </div>
    <form id="groupTxForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <label style="cursor:pointer">
          <input type="radio" name="gtxType" value="expense" checked style="display:none" id="gtxTypeExpense">
          <div id="gtxBtnExpense" style="padding:9px;border-radius:var(--radius);border:2px solid var(--red);background:var(--red-light);color:var(--red-text);text-align:center;font-size:13px;font-weight:500">Wydatek</div>
        </label>
        <label style="cursor:pointer">
          <input type="radio" name="gtxType" value="income" style="display:none" id="gtxTypeIncome">
          <div id="gtxBtnIncome" style="padding:9px;border-radius:var(--radius);border:2px solid var(--border);background:white;color:var(--text-secondary);text-align:center;font-size:13px;font-weight:500">Przychód</div>
        </label>
      </div>
      <div style="display:flex;flex-direction:column;gap:11px">
        <div class="form-group">
          <label class="form-label">Tytuł <span class="required">*</span></label>
          <input class="form-input" id="gtxTitle" type="text" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="form-group">
            <label class="form-label">Kwota</label>
            <div class="input-group">
              <input class="form-input" id="gtxAmount" type="number" min="0" step="0.01" style="text-align:right">
              <span class="input-group-suffix">PLN</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Data</label>
            <input class="form-input" id="gtxDate" type="date">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Opis</label>
          <textarea class="form-textarea" id="gtxDesc" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="groupTxCancelBtn">Anuluj</button>
        <button type="submit" class="btn btn-primary btn-sm" id="groupTxSaveBtn">Zapisz</button>
      </div>
    </form>
  </div>
</div>

<!-- Add Event Modal -->
<div class="modal-overlay hidden" id="groupEventModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Dodaj wydarzenie grupy</span>
      <div class="modal-close" id="groupEventModalClose">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
      </div>
    </div>
    <form id="groupEventForm">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-group">
          <label class="form-label">Tytuł <span class="required">*</span></label>
          <input class="form-input" id="gevTitle" type="text" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="form-group">
            <label class="form-label">Rozpoczęcie</label>
            <input class="form-input" id="gevStart" type="datetime-local">
          </div>
          <div class="form-group">
            <label class="form-label">Zakończenie</label>
            <input class="form-input" id="gevEnd" type="datetime-local">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Opis</label>
          <textarea class="form-textarea" id="gevDesc" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" id="groupEventCancelBtn">Anuluj</button>
        <button type="submit" class="btn btn-primary btn-sm" id="groupEventSaveBtn">Zapisz</button>
      </div>
    </form>
  </div>
</div>

<style>
.group-tab {
  padding: 8px 16px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-secondary);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font-body);
}
.group-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.group-tab:hover:not(.active) { color: var(--text-primary); }
</style>

<script type="module">
import { renderSidebar } from '../js/sidebar.js';
import { groupsApi, txApi, Auth } from '../js/api.js';
import {
  formatCurrency, formatDateShort, formatDateTime, initials,
  openModal, closeModal, setLoading, showSuccess, showError, confirmDialog
} from '../js/utils.js';

if (!Auth.isLoggedIn()) { window.location.href = 'login.html'; }
renderSidebar('groups.html');

const groupModal      = document.getElementById('groupModal');
const inviteModal     = document.getElementById('inviteModal');
const groupTxModal    = document.getElementById('groupTxModal');
const groupEventModal = document.getElementById('groupEventModal');
let activeGroupId     = null;
let activeTab         = 'transactions';

// ── Tabs ──────────────────────────────────────────────────────────
document.querySelectorAll('.group-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.group-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    document.getElementById('tabTransactions').style.display = activeTab === 'transactions' ? '' : 'none';
    document.getElementById('tabMembers').style.display      = activeTab === 'members'      ? '' : 'none';
    document.getElementById('tabCalendar').style.display     = activeTab === 'calendar'     ? '' : 'none';
    if (activeTab === 'calendar' && activeGroupId) loadGroupCalendar();
  });
});

// ── Load groups ───────────────────────────────────────────────────
async function loadGroups() {
  try {
    const groups = await groupsApi.list();
    const grid   = document.getElementById('groupsGrid');
    if (!groups.length) {
      grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state">
        <p class="empty-title">Brak grup</p>
        <p class="empty-desc">Utwórz pierwszą grupę, aby zarządzać wspólnym budżetem.</p>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('createGroupBtn').click()">Utwórz grupę</button>
      </div></div>`;
      return;
    }
    const TYPE_LABELS = { family:'Rodzina', company:'Firma', other:'Inne' };
    const ROLE_LABELS = { owner:'Właściciel', admin:'Admin', member:'Członek' };
    grid.innerHTML = groups.map(g => `
      <div class="card" style="cursor:pointer;transition:var(--transition)"
           onclick="openGroup(${g.id})"
           onmouseenter="this.style.boxShadow='var(--shadow-md)'"
           onmouseleave="this.style.boxShadow='var(--shadow-sm)'">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
          <div style="width:40px;height:40px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px">
            ${g.type === 'family' ? '👨‍👩‍👧' : g.type === 'company' ? '🏢' : '👥'}
          </div>
          <span class="badge ${g.my_role === 'owner' ? 'badge-green' : g.my_role === 'admin' ? 'badge-blue' : 'badge-gray'}">
            ${ROLE_LABELS[g.my_role] || g.my_role}
          </span>
        </div>
        <div style="font-size:15px;font-weight:600;margin-bottom:4px">${g.name}</div>
        <div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:12px">${TYPE_LABELS[g.type] || g.type}</div>
        <div style="font-size:12px;color:var(--text-muted)">${g.member_count || 0} członków</div>
      </div>`).join('');
  } catch (err) { showError(err.message); }
}

// ── Open group ────────────────────────────────────────────────────
window.openGroup = async (gid) => {
  activeGroupId = gid;
  document.getElementById('groupDetail').style.display = 'block';

  const [group, summary, txs] = await Promise.allSettled([
    groupsApi.get(gid),
    groupsApi.summary(gid),
    groupsApi.transactions(gid, { per_page: 20 }),
  ]);

  if (group.status === 'fulfilled') {
    const g = group.value;
    document.getElementById('groupDetailName').textContent = g.name;
    const ROLE_LABELS = { owner:'Właściciel', admin:'Administrator', member:'Członek' };
    document.getElementById('groupDetailRole').textContent = ROLE_LABELS[g.my_role] || g.my_role;
    renderMembers(g.members || [], g.my_role);
  }
  if (summary.status === 'fulfilled') {
    const s = summary.value;
    document.getElementById('gdIncome').textContent  = formatCurrency(s.income_total);
    document.getElementById('gdExpense').textContent = formatCurrency(s.expense_total);
    const b = document.getElementById('gdBalance');
    b.textContent = formatCurrency(s.balance);
    b.className   = `metric-value ${s.balance >= 0 ? 'positive' : 'negative'}`;
  }
  if (txs.status === 'fulfilled') renderGroupTx(txs.value.items || []);
  document.getElementById('groupDetail').scrollIntoView({ behavior: 'smooth' });
};

function renderMembers(members, myRole) {
  const el = document.getElementById('membersList');
  const ROLE_LABELS = { owner:'Właściciel', admin:'Admin', member:'Członek' };
  el.innerHTML = members.map(m => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg)">
      <div class="avatar" style="width:32px;height:32px;font-size:12px">${initials(m.first_name, m.last_name, m.email)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500">${m.first_name ? `${m.first_name} ${m.last_name||''}`.trim() : m.email}</div>
        <div style="font-size:11px;color:var(--text-muted)">${m.email}</div>
      </div>
      <span class="badge ${m.role === 'owner' ? 'badge-green' : m.role === 'admin' ? 'badge-blue' : 'badge-gray'}" style="font-size:10px">
        ${ROLE_LABELS[m.role] || m.role}
      </span>
    </div>`).join('');
}

function renderGroupTx(items) {
  const el = document.getElementById('groupTxList');
  if (!items.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><p class="empty-title">Brak transakcji</p><p class="empty-desc">Dodaj pierwszą transakcję grupy.</p></div>'; return; }
  el.innerHTML = items.map(tx => `
    <div class="tx-item" style="padding:10px 16px">
      <div class="tx-icon" style="background:${tx.type === 'income' ? 'var(--green-light)' : 'var(--red-light)'}">
        ${tx.type === 'income' ? '↑' : '↓'}
      </div>
      <div class="tx-info">
        <div class="tx-title">${tx.title}</div>
        <div class="tx-meta">${formatDateShort(tx.date)}</div>
      </div>
      <div class="tx-amount ${tx.type}">${tx.type === 'income' ? '+' : '-'}${formatCurrency(tx.amount)}</div>
    </div>`).join('');
}

async function loadGroupCalendar() {
  const el = document.getElementById('groupCalList');
  el.innerHTML = '<div class="loading-overlay" style="padding:20px"><div class="spinner"></div></div>';
  try {
    const events = await groupsApi.events(activeGroupId);
    if (!events.length) {
      el.innerHTML = '<div class="empty-state" style="padding:24px"><p class="empty-title">Brak wydarzeń</p><p class="empty-desc">Dodaj wydarzenie dla grupy.</p></div>';
      return;
    }
    el.innerHTML = events.map(ev => `
      <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg)">
        <div style="width:10px;height:10px;border-radius:50%;background:${ev.color||'var(--accent)'};flex-shrink:0;margin-top:4px"></div>
        <div>
          <div style="font-size:13.5px;font-weight:500">${ev.title}</div>
          <div style="font-size:12px;color:var(--text-muted)">${formatDateTime ? formatDateTime(ev.start) : ev.start}</div>
        </div>
      </div>`).join('');
  } catch {
    el.innerHTML = '<p class="text-muted text-sm" style="padding:16px">Nie można załadować kalendarza</p>';
  }
}

// ── Group CRUD ────────────────────────────────────────────────────
document.getElementById('createGroupBtn').addEventListener('click', () => {
  document.getElementById('groupForm').reset();
  openModal(groupModal);
});
document.getElementById('groupModalClose').addEventListener('click', () => closeModal(groupModal));
document.getElementById('groupCancelBtn').addEventListener('click',  () => closeModal(groupModal));

document.getElementById('groupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('groupSaveBtn');
  setLoading(btn, true);
  try {
    await groupsApi.create({
      name:        document.getElementById('gName').value.trim(),
      type:        document.getElementById('gType').value,
      description: document.getElementById('gDesc').value.trim(),
    });
    showSuccess('Grupa utworzona!');
    closeModal(groupModal);
    loadGroups();
  } catch (err) { showError(err.message); }
  finally { setLoading(btn, false); }
});

// ── Invite ────────────────────────────────────────────────────────
document.getElementById('inviteMemberBtn').addEventListener('click', () => { document.getElementById('inviteForm').reset(); openModal(inviteModal); });
document.getElementById('inviteModalClose').addEventListener('click', () => closeModal(inviteModal));
document.getElementById('inviteCancelBtn').addEventListener('click',  () => closeModal(inviteModal));

document.getElementById('inviteForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!activeGroupId) return;
  const btn = document.getElementById('inviteSaveBtn');
  setLoading(btn, true);
  try {
    await groupsApi.invite(activeGroupId, {
      email: document.getElementById('invEmail').value.trim(),
      role:  document.getElementById('invRole').value,
    });
    showSuccess('Zaproszono!');
    closeModal(inviteModal);
    openGroup(activeGroupId);
  } catch (err) { showError(err.message); }
  finally { setLoading(btn, false); }
});

// ── Add Transaction ───────────────────────────────────────────────
document.getElementById('addGroupTxBtn').addEventListener('click', () => {
  document.getElementById('groupTxForm').reset();
  document.getElementById('gtxDate').value = new Date().toISOString().slice(0,10);
  openModal(groupTxModal);
});
document.getElementById('groupTxModalClose').addEventListener('click', () => closeModal(groupTxModal));
document.getElementById('groupTxCancelBtn').addEventListener('click',  () => closeModal(groupTxModal));

// Type toggle
document.querySelectorAll('input[name="gtxType"]').forEach(r => {
  r.addEventListener('change', () => {
    const ie = document.getElementById('gtxTypeExpense').checked;
    document.getElementById('gtxBtnExpense').style.cssText = `padding:9px;border-radius:var(--radius);text-align:center;font-size:13px;font-weight:500;${ie?'border:2px solid var(--red);background:var(--red-light);color:var(--red-text)':'border:2px solid var(--border);background:white;color:var(--text-secondary)'}`;
    document.getElementById('gtxBtnIncome').style.cssText  = `padding:9px;border-radius:var(--radius);text-align:center;font-size:13px;font-weight:500;${!ie?'border:2px solid var(--green);background:var(--green-light);color:var(--green-text)':'border:2px solid var(--border);background:white;color:var(--text-secondary)'}`;
  });
});

document.getElementById('groupTxForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!activeGroupId) return;
  const btn  = document.getElementById('groupTxSaveBtn');
  const type = document.querySelector('input[name="gtxType"]:checked').value;
  const payload = {
    title:    document.getElementById('gtxTitle').value.trim(),
    amount:   document.getElementById('gtxAmount').value,
    type,
    date:     document.getElementById('gtxDate').value || new Date().toISOString(),
    description: document.getElementById('gtxDesc').value.trim(),
    group_id: activeGroupId,
  };
  if (!payload.title || !payload.amount) { showError('Wypełnij tytuł i kwotę.'); return; }
  setLoading(btn, true);
  try {
    await groupsApi.createTx(activeGroupId, payload);
    showSuccess('Transakcja dodana!');
    closeModal(groupTxModal);
    openGroup(activeGroupId);
  } catch (err) { showError(err.message); }
  finally { setLoading(btn, false); }
});

// ── Add Event ─────────────────────────────────────────────────────
document.getElementById('addGroupEventBtn').addEventListener('click', () => {
  document.getElementById('groupEventForm').reset();
  document.getElementById('gevStart').value = new Date().toISOString().slice(0,16);
  openModal(groupEventModal);
});
document.getElementById('groupEventModalClose').addEventListener('click', () => closeModal(groupEventModal));
document.getElementById('groupEventCancelBtn').addEventListener('click',  () => closeModal(groupEventModal));

document.getElementById('groupEventForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!activeGroupId) return;
  const btn = document.getElementById('groupEventSaveBtn');
  const payload = {
    title:       document.getElementById('gevTitle').value.trim(),
    start:       document.getElementById('gevStart').value,
    end:         document.getElementById('gevEnd').value || null,
    description: document.getElementById('gevDesc').value.trim(),
    group_id:    activeGroupId,
  };
  if (!payload.title) { showError('Tytuł jest wymagany.'); return; }
  setLoading(btn, true);
  try {
    await groupsApi.createEvent(activeGroupId, payload);
    showSuccess('Wydarzenie dodane!');
    closeModal(groupEventModal);
    document.querySelector('[data-tab="calendar"]').click();
  } catch (err) { showError(err.message); }
  finally { setLoading(btn, false); }
});

// ── Add Invoice (redirect) ────────────────────────────────────────
document.getElementById('addGroupInvoiceBtn').addEventListener('click', () => {
  // Zapisz group_id do sessionStorage i przekieruj na faktury
  sessionStorage.setItem('invoice_group_id', activeGroupId);
  sessionStorage.setItem('invoice_group_name', document.getElementById('groupDetailName').textContent);
  window.location.href = 'invoices.html';
});

// ── Leave group ───────────────────────────────────────────────────
document.getElementById('leaveGroupBtn').addEventListener('click', async () => {
  if (!activeGroupId) return;
  const ok = await confirmDialog('Czy na pewno chcesz opuścić tę grupę?', 'Opuść grupę');
  if (!ok) return;
  try {
    await groupsApi.leave(activeGroupId);
    showSuccess('Opuściłeś grupę');
    document.getElementById('groupDetail').style.display = 'none';
    loadGroups();
  } catch (err) { showError(err.message); }
});

document.getElementById('closeDetailBtn').addEventListener('click', () => {
  document.getElementById('groupDetail').style.display = 'none';
  activeGroupId = null;
});

loadGroups();
</script>
</body>
</html>
